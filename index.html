<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>周期表 暗記アプリ</title>
<style>
:root{
  --bg:#f7f6f2; --panel:#ffffff; --ink:#1d1d1f; --ink2:#5b5b63; --line:#d9d7d0; --accent:#1f5fbf;
  --dim:.22; --cellL:88%; --cellS:62%; --cellLine:68%;
  --shadow:0 10px 40px rgba(0,0,0,.18);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic","Noto Sans JP",Meiryo,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#16171a;--panel:#212226;--ink:#ececef;--ink2:#a4a4ad;--line:#3a3b40;--accent:#7fb0ff;
    --cellL:26%;--cellS:32%;--cellLine:42%;--shadow:0 10px 40px rgba(0,0,0,.6);}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-size:15px;line-height:1.6}
button{font:inherit;color:inherit}
header{padding:16px 16px 8px;max-width:1240px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px;letter-spacing:.04em}
h1 small{font-size:12px;font-weight:500;color:var(--ink2);margin-left:8px;letter-spacing:0}
.lead{margin:0;color:var(--ink2);font-size:13px}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:12px;align-items:center}
.ctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ctl>span{font-size:12px;color:var(--ink2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:5px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
main{max-width:1240px;margin:0 auto;padding:4px 16px 32px}
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
.table{display:grid;grid-template-columns:20px repeat(18,minmax(48px,1fr));grid-auto-rows:auto;gap:3px;min-width:900px}
.ghead{font-size:11px;color:var(--ink2);text-align:center;align-self:end}
.phead{font-size:11px;color:var(--ink2);display:flex;align-items:center;justify-content:center}
.cell{position:relative;aspect-ratio:1/1.08;border-radius:6px;border:1px solid hsl(var(--h) var(--cellS) var(--cellLine));
  background:hsl(var(--h) var(--cellS) var(--cellL));padding:3px 4px;cursor:pointer;text-align:left;display:flex;flex-direction:column;
  transition:transform .12s, opacity .2s, box-shadow .12s;min-width:0}
.cell:hover,.cell:focus-visible{transform:scale(1.08);z-index:2;box-shadow:0 4px 14px rgba(0,0,0,.18);outline:none}
.cell:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.cell .z{font-size:10px;line-height:1;color:var(--ink2)}
.cell .sym{font-size:20px;font-weight:700;line-height:1.05;text-align:center;margin-top:2px}
.cell .nm{font-size:9.5px;line-height:1.12;text-align:center;margin-top:auto;word-break:break-all;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cell .nm.s{font-size:8.5px;letter-spacing:-.03em}
.cell.has::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--ink);opacity:.55}
.cell.off{opacity:var(--dim)}
.cell.ph{cursor:pointer;justify-content:center;align-items:center;text-align:center;font-size:10px;line-height:1.3}
.gap{grid-column:1/-1;height:10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 8px;margin:14px 0 4px}
.legend button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px 3px 6px;font-size:12.5px;cursor:pointer}
.legend button i{width:14px;height:14px;border-radius:4px;background:hsl(var(--h) var(--cellS) var(--cellL));border:1px solid hsl(var(--h) var(--cellS) var(--cellLine))}
.legend button[aria-pressed="true"]{outline:2px solid var(--ink)}
.note{font-size:12px;color:var(--ink2);margin:6px 0 0}
/* dialog */
dialog{border:0;padding:0;border-radius:16px;max-width:min(720px,calc(100vw - 24px));width:100%;background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,10,14,.45)}
.card{padding:20px 20px 16px;max-height:calc(100dvh - 40px);overflow-y:auto}
.ctop{display:flex;gap:16px;align-items:flex-start}
.tile{flex:none;width:104px;height:112px;border-radius:12px;border:2px solid hsl(var(--h) var(--cellS) var(--cellLine));background:hsl(var(--h) var(--cellS) var(--cellL));display:flex;flex-direction:column;padding:6px 8px}
.tile .z{font-size:14px;color:var(--ink2);line-height:1}
.tile .sym{font-size:44px;font-weight:700;text-align:center;line-height:1.1;margin-top:4px}
.tile .nm{font-size:12px;text-align:center;margin-top:auto}
.ctitle h2{margin:0;font-size:26px;line-height:1.2}
.ctitle .en{color:var(--ink2);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;white-space:nowrap}
.close{margin-left:auto;border:0;background:transparent;font-size:26px;line-height:1;cursor:pointer;color:var(--ink2);padding:0 4px}
.sec{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.sec h3{font-size:13px;color:var(--ink2);margin:0 0 2px;font-weight:600}
.sec p{margin:0 0 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px}
.hs{display:none}
body.high .hs{display:block}
.badge{display:inline-block;font-size:10.5px;border:1px solid var(--accent);color:var(--accent);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:2px;font-weight:600}
.flame{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:6px;border:1px solid var(--line)}
.bohr{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.bohr svg{width:170px;height:170px;flex:none}
.empty{color:var(--ink2);background:var(--bg);border-radius:10px;padding:12px 14px;margin-top:16px;font-size:14px}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
.nav button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;cursor:pointer;font-size:14px}
.nav button:disabled{opacity:.35;cursor:default}

.tabs{display:flex;gap:4px;margin-top:12px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:8px 14px;font-size:14.5px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;color:var(--ink2)}
.tabs button[aria-pressed="true"]{border-bottom-color:var(--accent);color:var(--ink);font-weight:700}
body:not(.vtable) .tonly{display:none}
.summary{margin:2px 0 10px;font-size:13px;color:var(--ink2)}
.summary b{color:var(--ink)}
.cell[data-m="good"] .z::after{content:" ✓";font-weight:700;color:var(--ink)}
.cell[data-m="weak"] .z::after{content:" !";font-weight:700;color:var(--ink)}
.setup,.session{max-width:560px;margin:8px auto 0}
.setup h2{font-size:20px;margin:6px 0 2px}
.field{display:flex;align-items:center;gap:10px;margin:14px 0;flex-wrap:wrap}
.field>span{font-size:13px;color:var(--ink2);width:56px;flex:none}
select{font:inherit;font-size:15px;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);max-width:100%}
.poolinfo{font-size:13px;color:var(--ink2);margin:6px 0 12px}
.primary{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:12px 28px;font-size:16px;font-weight:700;cursor:pointer}
@media (prefers-color-scheme:dark){.primary{color:#111}}
.primary:disabled{opacity:.4;cursor:default}
.sbar{display:flex;gap:12px;align-items:center;font-size:13px;color:var(--ink2);margin-top:8px}
.sbar .link{margin-left:auto}
.link{border:0;background:transparent;color:var(--accent);cursor:pointer;font-size:13px;padding:4px}
.progress{height:6px;border-radius:3px;background:var(--line);margin:8px 0 16px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.fcard{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:260px;border-radius:18px;border:2px solid hsl(var(--h) var(--cellS) var(--cellLine));background:hsl(var(--h) var(--cellS) var(--cellL));cursor:pointer;padding:20px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.fcard .q{font-size:64px;font-weight:700;line-height:1.1}
.fcard .q.txt{font-size:38px}
.fcard .sub{font-size:13px;color:var(--ink2);margin-top:12px}
.fcard .a{font-size:30px;font-weight:700;line-height:1.3}
.fcard .a small{display:block;font-size:14px;font-weight:400;color:var(--ink2);margin-top:4px}
.fcard .use{font-size:14px;margin-top:12px;max-width:420px}
.fbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.fbtns button{border-radius:12px;padding:14px;font-size:17px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--panel)}
.fbtns button small{font-weight:400;color:var(--ink2);font-size:12px}
.fbtns .got{border-color:hsl(140 45% 45%);}
.fbtns .again{border-color:hsl(4 60% 60%);}
.fbtns button:disabled{opacity:.35}
.keys{font-size:12px;color:var(--ink2);text-align:center}
.qtext{font-size:20px;font-weight:700;line-height:1.5;margin:4px 0 14px;min-height:60px}
.qtext .big{display:block;font-size:56px;line-height:1.2;margin-top:4px}
.qtext .hintline{display:block;font-size:13px;font-weight:400;color:var(--ink2)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choices button{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:14px 10px;font-size:17px;cursor:pointer;min-height:58px}
.choices button:hover:not(:disabled){border-color:var(--accent)}
.choices button.ok{background:hsl(140 55% var(--cellL));border-color:hsl(140 45% 45%);font-weight:700}
.choices button.ng{background:hsl(4 70% var(--cellL));border-color:hsl(4 60% 55%)}
.choices button:disabled{cursor:default;color:var(--ink)}
.feedback{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.feedback .res{font-weight:700;font-size:16px}
.feedback .res.ok{color:hsl(140 50% 34%)} .feedback .res.ng{color:hsl(4 65% 46%)}
@media (prefers-color-scheme:dark){.feedback .res.ok{color:hsl(140 50% 62%)} .feedback .res.ng{color:hsl(4 75% 68%)}}
.feedback p{margin:4px 0}
.fbrow{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
.done{text-align:center}
.done .score{font-size:44px;font-weight:700;margin:10px 0 0}
.mlist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
.mlist button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 10px;cursor:pointer}
.donebtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.ghost{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:11px 20px;font-size:15px;cursor:pointer}
.reset{margin-top:6px}
@media (max-width:600px){
  .choices{grid-template-columns:1fr}
  .qtext .big{font-size:46px}
  .fcard{min-height:220px}.fcard .q{font-size:54px}
  .tabs button{padding:8px 10px;font-size:14px}
  header{padding:12px 12px 4px} main{padding:4px 12px 24px}
  h1{font-size:19px}
  .grid2{grid-template-columns:1fr}
  .tile{width:84px;height:92px}.tile .sym{font-size:34px}
  .ctitle h2{font-size:22px}
  .card{padding:16px 14px 12px}
  .cell{padding:2px 3px}.cell .sym{font-size:17px}
  .hint{display:block}
}
.hint{display:none;font-size:12px;color:var(--ink2);margin:0 0 6px}
</style>
</head>
<body>
<header>
  <h1>周期表 暗記アプリ<small>試作版 v0.9</small></h1>
  <p class="lead">元素をタップすると詳しいカードが開きます。</p>
  <nav class="tabs" id="tabs" aria-label="画面の切り替え">
    <button data-v="table">周期表</button><button data-v="flash">カードで覚える</button><button data-v="quiz">4択クイズ</button>
  </nav>
  <div class="controls">
    <div class="ctl"><span>表示</span><div class="seg" id="levelSeg">
      <button data-v="junior">中学</button><button data-v="high">高校</button></div></div>
    <div class="ctl tonly"><span>色分け</span><div class="seg" id="colorSeg">
      <button data-v="cat">分類</button><button data-v="state">常温の状態</button><button data-v="metal">金属・非金属</button><button data-v="type">典型・遷移</button><button data-v="mastery">覚えた度</button></div></div>
    <div class="ctl tonly"><span>範囲</span><div class="seg" id="rangeSeg">
      <button data-v="20">1〜20番</button><button data-v="36">1〜36番</button><button data-v="detail">重要46</button><button data-v="all">すべて</button></div></div>
  </div>
</header>
<main>
<section id="v-table">
  <p class="summary" id="summary"></p>
  <p class="hint">← 周期表は横にスクロールできます →</p>
  <div class="scroller"><div class="table" id="table" role="grid" aria-label="周期表"></div></div>
  <div class="legend" id="legend"></div>
  <p class="note" id="legendNote"></p>
</section>

<section id="v-flash" hidden>
  <div class="setup" id="flashSetup">
    <h2>カードで覚える</h2>
    <p class="lead">表を見て答えを思い浮かべ、タップして裏返します。「覚えた」まで同じカードが何度も出ます。</p>
    <label class="field"><span>範囲</span><select id="flashRange" class="rangeSel"></select></label>
    <div class="field"><span>出題</span><div class="seg" id="flashDir">
      <button data-v="sym">記号 → 名称</button><button data-v="name">名称 → 記号</button><button data-v="num">番号 → 元素</button><button data-v="mix">まぜる</button></div></div>
    <p class="poolinfo" id="flashInfo"></p>
    <button class="primary" id="flashStart">はじめる</button>
  </div>
  <div class="session" id="flashSession" hidden>
    <div class="sbar"><span id="flashLeft"></span><button class="link" id="flashQuit">やめる</button></div>
    <div class="progress"><i id="flashBar"></i></div>
    <button class="fcard" id="fcard" aria-live="polite"></button>
    <div class="fbtns"><button class="again" id="fAgain">まだ <small>←</small></button><button class="got" id="fGot">覚えた <small>→</small></button></div>
    <p class="keys">キーボード：スペースで裏返す、← まだ、→ 覚えた</p>
  </div>
  <div class="session done" id="flashDone" hidden></div>
</section>

<section id="v-quiz" hidden>
  <div class="setup" id="quizSetup">
    <h2>4択クイズ</h2>
    <p class="lead">結果は元素ごとに記録され、周期表の「覚えた度」に反映されます。</p>
    <label class="field"><span>範囲</span><select id="quizRange" class="rangeSel"></select></label>
    <label class="field"><span>形式</span><select id="quizType"></select></label>
    <div class="field"><span>問題数</span><div class="seg" id="quizCount">
      <button data-v="10">10問</button><button data-v="20">20問</button><button data-v="all">範囲すべて</button></div></div>
    <p class="poolinfo" id="quizInfo"></p>
    <button class="primary" id="quizStart">はじめる</button>
  </div>
  <div class="session" id="quizSession" hidden>
    <div class="sbar"><span id="quizNo"></span><span id="quizScore"></span><button class="link" id="quizQuit">やめる</button></div>
    <div class="progress"><i id="quizBar"></i></div>
    <div class="qtext" id="qtext"></div>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback" hidden></div>
  </div>
  <div class="session done" id="quizDone" hidden></div>
</section>
</main>

<dialog id="dlg" aria-labelledby="cName"><div class="card" id="card"></div></dialog>

// ---------- 位置・分類の計算 ----------
const SETS = {
  alkali:[3,11,19,37,55,87], alkaline:[4,12,20,38,56,88], halogen:[9,17,35,53,85,117],
  noble:[2,10,18,36,54,86,118], metalloid:[5,14,32,33,51,52], nonmetal:[1,6,7,8,15,16,34],
  post:[13,31,49,50,81,82,83,84,113,114,115,116]
};
const CATS = {
  alkali:{name:"アルカリ金属",h:4}, alkaline:{name:"アルカリ土類金属",h:30}, transition:{name:"遷移元素",h:212},
  post:{name:"典型元素（金属）",h:168}, metalloid:{name:"半金属",h:95}, nonmetal:{name:"非金属",h:52},
  halogen:{name:"ハロゲン",h:300}, noble:{name:"貴ガス",h:262}, lanthanoid:{name:"ランタノイド",h:188}, actinoid:{name:"アクチノイド",h:336}
};
const STATES = {solid:{name:"固体",h:30}, liquid:{name:"液体",h:198}, gas:{name:"気体",h:135}, unknown:{name:"不明",h:240}};
const METALS = {metal:{name:"金属",h:212}, metalloid:{name:"半金属",h:95}, nonmetal:{name:"非金属",h:52}};
const TYPES = {typical:{name:"典型元素",h:30}, transition:{name:"遷移元素",h:212}};
const MASTERY = {none:{name:"未学習",h:220,s:"5%"}, weak:{name:"苦手（！）",h:4}, learning:{name:"練習中",h:48}, good:{name:"覚えた（✓）",h:140}};

function place(z){
  if(z===1) return {g:1,p:1};
  if(z===2) return {g:18,p:1};
  const ps=[[3,2],[11,3],[19,4],[37,5],[55,6],[87,7]];
  let start=0,p=0; for(const [s,pp] of ps){ if(z>=s){start=s;p=pp;} }
  const o=z-start;
  if(p<=3) return {g: o<2 ? o+1 : o+11, p};
  if(p<=5) return {g:o+1,p};
  if(o<2) return {g:o+1,p};
  if(o<=16) return {g:3,p,f:true,col:o+1};   // ランタノイド・アクチノイド（3族）
  return {g:o-13,p};
}
function category(z){
  for(const k in SETS) if(SETS[k].includes(z)) return k;
  if(z>=57&&z<=71) return "lanthanoid";
  if(z>=89&&z<=103) return "actinoid";
  return "transition";
}
function stateOf(z){
  if([1,2,7,8,9,10,17,18,36,54,86].includes(z)) return "gas";
  if([35,80].includes(z)) return "liquid";
  if(z>=100) return "unknown";
  return "solid";
}
const EL = BASIC.map(([z,sym,name,en])=>{
  const pl=place(z), cat=category(z);
  const metal = ["metalloid"].includes(cat)?"metalloid":(["nonmetal","halogen","noble"].includes(cat)?"nonmetal":"metal");
  const type = (pl.g<=2||pl.g>=13)&&!pl.f ? "typical" : "transition";
  return {z,sym,name,en,...pl,cat,state:stateOf(z),metal,type,d:DETAIL[z]||null};
});

// 重要元素：1〜36番＋よく出る10元素（Sr・Ag・Sn・I・Ba・Pt・Au・Hg・Pb・U）
const KEY46=z=>z<=36||[38,47,50,53,56,78,79,80,82,92].includes(z);

const store={get(k,d){try{return localStorage.getItem("pt."+k)||d}catch(e){return d}},
             set(k,v){try{localStorage.setItem("pt."+k,v)}catch(e){}}};
const S={level:store.get("level","high"), color:store.get("color","cat"), range:store.get("range","20"), focus:null, view:store.get("view","table")};

// ---------- 学習記録 ----------
// rec[z] = {c:正解数, w:不正解数, s:連続正解数, t:最終日時}
let REC={}; try{REC=JSON.parse(localStorage.getItem("pt.rec")||"{}")||{}}catch(e){REC={}}
function saveRec(){try{localStorage.setItem("pt.rec",JSON.stringify(REC))}catch(e){}}
function record(z,ok){const r=REC[z]||{c:0,w:0,s:0,t:0}; if(ok){r.c++;r.s++}else{r.w++;r.s=0} r.t=Date.now(); REC[z]=r; saveRec();}
function mstat(z){const r=REC[z]; if(!r) return "none"; if(r.s>=3) return "good"; if(r.s===0&&r.w>0) return "weak"; return "learning";}

const table=document.getElementById("table");
function build(){
  const frag=document.createDocumentFragment();
  const add=(el,col,row)=>{el.style.gridColumn=col;el.style.gridRow=row;frag.appendChild(el)};
  for(let g=1;g<=18;g++){const d=document.createElement("div");d.className="ghead";d.textContent=g;add(d,g+1,1)}
  for(let p=1;p<=7;p++){const d=document.createElement("div");d.className="phead";d.textContent=p;add(d,1,p+1)}
  for(const e of EL){
    const b=document.createElement("button");
    b.className="cell"; b.dataset.z=e.z;
    b.setAttribute("aria-label",`${e.z}番 ${e.sym} ${e.name}`);
    b.innerHTML=`<span class="z">${e.z}</span><span class="sym">${e.sym}</span><span class="nm${e.name.length>5?" s":""}">${e.name}</span>`;
    b.addEventListener("click",()=>openCard(e.z));
    if(e.f) add(b, e.col+1, e.p===6?10:11); else add(b,e.g+1,e.p+1);
  }
  const ph=(txt,row,first)=>{const b=document.createElement("button");b.className="cell ph";b.dataset.ph=row;
    b.innerHTML=txt;b.addEventListener("click",()=>openCard(first));add(b,4,row)};
  ph("57〜71<br>ランタ<br>ノイド",7,57); ph("89〜103<br>アクチ<br>ノイド",8,89);
  const gap=document.createElement("div");gap.className="gap";gap.style.gridRow=9;frag.appendChild(gap);
  const lab=(t,row)=>{const d=document.createElement("div");d.className="phead";d.style.justifyContent="flex-end";d.style.fontSize="10.5px";d.style.whiteSpace="nowrap";d.textContent=t;d.style.gridColumn="2 / 4";d.style.gridRow=row;d.style.paddingRight="6px";frag.appendChild(d)};
  lab("ランタノイド",10); lab("アクチノイド",11);
  table.appendChild(frag);
}
function palette(){ return S.color==="state"?STATES:S.color==="metal"?METALS:S.color==="type"?TYPES:S.color==="mastery"?MASTERY:CATS }
function keyOf(e){ return S.color==="state"?e.state:S.color==="metal"?e.metal:S.color==="type"?e.type:S.color==="mastery"?mstat(e.z):e.cat }
function inRange(e){
  if(S.range==="20") return e.z<=20;
  if(S.range==="36") return e.z<=36;
  if(S.range==="detail") return KEY46(e.z);
  return true;
}
function paint(){
  const pal=palette();
  table.querySelectorAll(".cell").forEach(c=>{
    if(c.dataset.ph){ const k=S.color==="state"?"solid":S.color==="metal"?"metal":S.color==="type"?"transition":S.color==="mastery"?"none":(c.dataset.ph==="7"?"lanthanoid":"actinoid");
      if(pal[k].s) c.style.setProperty("--cellS",pal[k].s); else c.style.removeProperty("--cellS");
      c.style.setProperty("--h",pal[k].h); c.classList.toggle("off",S.range==="20"||S.range==="36"||(S.focus&&S.focus!==k)); return; }
    const e=EL[c.dataset.z-1], k=keyOf(e);
    c.style.setProperty("--h",pal[k].h);
    if(pal[k].s) c.style.setProperty("--cellS",pal[k].s); else c.style.removeProperty("--cellS");
    if(S.color==="mastery") c.dataset.m=k; else delete c.dataset.m;
    c.classList.toggle("off", !inRange(e) || (S.focus && S.focus!==k));
  });
  const lg=document.getElementById("legend"); lg.innerHTML="";
  for(const k in pal){
    const b=document.createElement("button"); b.style.setProperty("--h",pal[k].h); if(pal[k].s) b.style.setProperty("--cellS",pal[k].s);
    b.setAttribute("aria-pressed",S.focus===k); b.innerHTML=`<i></i>${pal[k].name}`;
    b.title="クリックでこの色の元素だけを強調"; b.onclick=()=>{S.focus=S.focus===k?null:k;paint()}; lg.appendChild(b);
  }
  const notes={cat:"凡例をクリックすると、その分類の元素だけを強調します。",
    state:"常温（25℃）・常圧での状態。原子番号100以降は性質が分かっていないため「不明」としています。",
    metal:"半金属は金属と非金属の中間の性質をもつ元素です。",
    type:"12族（亜鉛・カドミウム・水銀など）は典型元素とする教科書もあります。",
    mastery:"カードとクイズの結果から色分けします。3回続けて正解すると「覚えた（✓）」、最後に間違えると「苦手（！）」になります。"};
  document.getElementById("legendNote").textContent=notes[S.color];
  document.body.classList.toggle("high",S.level==="high");

const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function bohrSVG(e){
  const shells=[...e.d.config.matchAll(/[A-Z](\d+)/g)].map(m=>+m[1]); const n=shells.length;
  const R0=22, step=(80-R0)/Math.max(n,1);
  let s=`<svg viewBox="-90 -90 180 180" role="img" aria-label="電子配置の図 ${esc(e.d.config)}">`;
  s+=`<circle r="15" fill="hsl(${CATS[e.cat].h} 60% 55%)"/><text y="5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">${esc(e.sym)}</text>`;
  shells.forEach((cnt,i)=>{const r=R0+step*(i+1)-step/2+6;
    s+=`<circle r="${r.toFixed(1)}" fill="none" stroke="currentColor" stroke-opacity=".28"/>`;
    const dot=cnt>18?2:2.8;
    for(let k=0;k<cnt;k++){const a=-Math.PI/2+2*Math.PI*k/cnt;
      s+=`<circle cx="${(r*Math.cos(a)).toFixed(1)}" cy="${(r*Math.sin(a)).toFixed(1)}" r="${dot}" fill="var(--accent)"/>`;}
  });
  return s+"</svg>";
}

  if(d){

    html+=`<div class="sec"><h3>どこにある？（天然での存在状態）</h3><p>${esc(d.occ)}</p>

      <div><h3>よくなるイオン</h3><p>${esc(d.ion)}</p></div>
      <div class="hs"><h3>炎色反応<span class="badge">高校</span></h3><p>${flame}</p></div></div>
    <div class="sec hs"><h3>原子の構造<span class="badge">高校</span></h3>
      <div class="bohr">${bohrSVG(e)}<div><p><b>電子配置</b>　${esc(d.config)}</p><p><b>価電子数</b>　${esc(d.val)}</p><p><b>原子量</b>　${esc(d.mass)}</p></div></div></div>`;
  } else {
    html+=`<div class="empty">この元素の詳しい情報（存在状態・用途・化合物など）は準備中です。</div>`;
  }
  html+=`<div class="nav"><button id="prev" ${z<=1?"disabled":""}>← ${z>1?esc(EL[z-2].sym)+" "+esc(EL[z-2].name):""}</button>
    <button id="next" ${z>=118?"disabled":""}>${z<118?esc(EL[z].sym)+" "+esc(EL[z].name):""} →</button></div>`;

const mask=(t,e)=>{ // 元素名と、それを含む言い方（フッ化・塩化・ケイ酸など）を伏せる
  let w=[e.name]; if(e.name.endsWith("素")) w.push(e.name.slice(0,-1)+"化"); if(e.name==="硫黄") w.push("硫化"); if(e.name==="ケイ素") w.push("ケイ酸");
  let out=String(t); for(const x of w) out=out.split(x).join("〇〇"); return out; };
const QT={
  sym2name:{label:"記号 → 名称", ok:()=>true, opt:e=>e.name,
    q:e=>`<span class="big">${esc(e.sym)}</span><span class="hintline">この元素の名称は？</span>`},
  name2sym:{label:"名称 → 記号", ok:()=>true, opt:e=>e.sym,
    q:e=>`<span class="big" style="font-size:40px">${esc(e.name)}</span><span class="hintline">元素記号は？</span>`},
  num2el:{label:"原子番号 → 元素", ok:()=>true, opt:e=>`${e.sym}（${e.name}）`,
    q:e=>`<span class="hintline">原子番号</span><span class="big">${e.z}</span><span class="hintline">この番号の元素は？</span>`},
  el2num:{label:"元素 → 原子番号", ok:()=>true, opt:e=>`${e.z}番`, near:6,
    q:e=>`<span class="big">${esc(e.sym)}</span><span class="hintline">${esc(e.name)} の原子番号は？</span>`},
  pos2el:{label:"族・周期 → 元素", ok:e=>!e.f, opt:e=>`${e.sym}（${e.name}）`,
    q:e=>`<span class="big" style="font-size:34px">第${e.p}周期・${e.g}族</span><span class="hintline">周期表のこの位置にある元素は？</span>`},
  use2el:{label:"身近な使われ方 → 元素", ok:e=>!!(e.d&&e.d.use&&!e.d.use.includes(e.sym)&&!e.d.use.startsWith("研究用")), opt:e=>`${e.sym}（${e.name}）`,
    q:e=>`「${esc(mask(e.d.use,e))}」<span class="hintline">このように使われている元素は？</span>`},
  occ2el:{label:"天然での存在 → 元素", ok:e=>!!(e.d&&e.d.occ&&!e.d.occ.includes(e.sym)&&!/^天然には(存在しない|ほとんど)/.test(e.d.occ)), opt:e=>`${e.sym}（${e.name}）`,
    q:e=>`「${esc(mask(e.d.occ,e))}」<span class="hintline">天然でこのように存在している元素は？</span>`},
  flame2el:{label:"炎色反応 → 元素", high:true, ok:e=>!!(e.d&&FLAME[e.d.flame]), opt:e=>`${e.sym}（${e.name}）`,
    q:e=>`<span class="big" style="font-size:34px"><span class="flame" style="width:28px;height:28px;background:${FLAME[e.d.flame]}"></span>${esc(e.d.flame)}</span><span class="hintline">炎色反応がこの色になる元素は？</span>`}
};
const qx={list:[],i:0,ok:0,miss:[],answered:false};
const quizRange=document.getElementById("quizRange"), quizType=document.getElementById("quizType");
quizRange.addEventListener("change",()=>{store.set("quizRange",quizRange.value);quizInfo();});
quizType.addEventListener("change",()=>{store.set("quizType",quizType.value);quizInfo();});
segBind("quizCount","quizCount","10",quizInfo);
function allowedTypes(){return Object.keys(QT).filter(k=>!QT[k].high||S.level==="high");}
function fillTypes(){
  const cur=store.get("quizType","mix"); quizType.innerHTML=`<option value="mix">おまかせ（いろいろな形式）</option>`+allowedTypes().map(k=>`<option value="${k}">${QT[k].label}</option>`).join("");
  quizType.value=cur; if(!quizType.value) quizType.value="mix";
}
function typeOkFor(e,t){ return t==="mix" ? allowedTypes().some(k=>QT[k].ok(e)) : QT[t].ok(e); }
function quizPool(){ const t=quizType.value; return EL.filter(RANGE_FN[quizRange.value]).filter(e=>typeOkFor(e,t)); }
function quizInfo(){ const n=quizPool().length, c=store.get("quizCount","10"), q=c==="all"?n:+c;
  document.getElementById("quizInfo").textContent = n ? `対象の元素：${n}個 → ${q}問を出題します。`
    : "この範囲・形式で出せる問題がありません。範囲を広げるか、形式を「おまかせ」にしてください。";
  document.getElementById("quizStart").disabled=!n; }
function makeQ(e,t){
  if(t==="mix") t=pick(allowedTypes().filter(k=>QT[k].ok(e)));
  const T=QT[t], label=T.opt(e);
  let cand=EL.filter(x=>x!==e && T.ok(x) && T.opt(x)!==label);
  const inR=new Set(EL.filter(RANGE_FN[quizRange.value]).map(x=>x.z));
  // 近い番号・同じ範囲の元素を選びやすくして、まぎらわしい選択肢にする
  cand=cand.map(x=>({x,k:Math.abs(x.z-e.z)*(inR.has(x.z)?0.6:1.4)+Math.random()*(T.near||10)})).sort((a,b)=>a.k-b.k).map(o=>o.x);
  const ds=[]; for(const x of cand){ if(ds.length>=3) break; if(!ds.some(y=>T.opt(y)===T.opt(x))) ds.push(x); }
  return {e,t,text:T.q(e),opts:shuffle([e,...ds]).map(x=>({z:x.z,label:T.opt(x)}))};
}
function quizStart(list){
  const pool=list||quizPool(), c=store.get("quizCount","10"), n=list?list.length:(c==="all"?pool.length:+c);
  let seq=[]; while(seq.length<n){ let s=shuffle(pool); if(seq.length&&s[0]===seq[seq.length-1]&&s.length>1) s.push(s.shift()); seq=seq.concat(s); }
  qx.list=seq.slice(0,n).map(e=>makeQ(e,quizType.value)); qx.i=0; qx.ok=0; qx.miss=[]; qx.pool=pool;
  document.getElementById("quizSetup").hidden=true; document.getElementById("quizDone").hidden=true; document.getElementById("quizSession").hidden=false;
  quizRender();
}
function quizRender(){
  const Q=qx.list[qx.i]; qx.answered=false;
  document.getElementById("quizNo").textContent=`第${qx.i+1}問 / ${qx.list.length}`;
  document.getElementById("quizScore").textContent=`正解 ${qx.ok}`;
  document.getElementById("quizBar").style.width=(100*qx.i/qx.list.length)+"%";
  document.getElementById("qtext").innerHTML=Q.text;
  const ch=document.getElementById("choices"); ch.innerHTML="";
  Q.opts.forEach((o,i)=>{const b=document.createElement("button"); b.textContent=o.label; b.dataset.z=o.z; b.setAttribute("aria-label",`${i+1}：${o.label}`); b.onclick=()=>quizAnswer(o.z); ch.appendChild(b);});
  document.getElementById("feedback").hidden=true;
}
function quizAnswer(z){
  if(qx.answered) return; qx.answered=true;
  const Q=qx.list[qx.i], e=Q.e, ok=z===e.z; record(e.z,ok);
  if(ok) qx.ok++; else if(!qx.miss.includes(e)) qx.miss.push(e);
  document.querySelectorAll("#choices button").forEach(b=>{b.disabled=true; if(+b.dataset.z===e.z) b.classList.add("ok"); else if(+b.dataset.z===z) b.classList.add("ng");});
  const fb=document.getElementById("feedback"); fb.hidden=false;
  const last=qx.i===qx.list.length-1;
  fb.innerHTML=`<div class="res ${ok?"ok":"ng"}">${ok?"正解！":"ざんねん… 正解は "+esc(QT[Q.t].opt(e))}</div>
    <p><b>${e.z}　${esc(e.sym)}　${esc(e.name)}</b>　${posText(e)}</p>${firstUse(e)?`<p>${esc(firstUse(e))}</p>`:""}
    <div class="fbrow"><button class="primary" id="qNext">${last?"結果を見る":"次へ"}</button><button class="link" id="qMore">詳しく見る</button></div>`;
  document.getElementById("qNext").onclick=quizNext; document.getElementById("qMore").onclick=()=>openCard(e.z);
  document.getElementById("qNext").focus();
  document.getElementById("quizScore").textContent=`正解 ${qx.ok}`;
}
function quizNext(){ if(!qx.answered) return; qx.i++; if(qx.i>=qx.list.length) return quizFinish(); quizRender(); }
function quizFinish(){
  document.getElementById("quizSession").hidden=true; const d=document.getElementById("quizDone"); d.hidden=false;
  const n=qx.list.length, pct=Math.round(100*qx.ok/n);
  const msg=pct===100?"全問正解！":pct>=80?"よくできました":pct>=50?"あと少し！":"カードで復習してから再挑戦しよう";
  d.innerHTML=`<h2>結果</h2><p class="score">${qx.ok} / ${n}</p><p>${msg}（正答率 ${pct}%）</p>
    ${qx.miss.length?`<p>間違えた元素（タップで詳しく）</p><div class="mlist">${qx.miss.map(e=>`<button data-z="${e.z}">${esc(e.sym)} ${esc(e.name)}</button>`).join("")}</div>`:""}
    <div class="donebtns">${qx.miss.length?`<button class="primary" id="qdMiss">間違えた元素だけもう一度</button>`:""}<button class="ghost" id="qdAgain">もう一度</button><button class="ghost" id="qdBack">設定に戻る</button></div>`;
  d.querySelectorAll(".mlist button").forEach(b=>b.onclick=()=>openCard(+b.dataset.z));
  if(qx.miss.length) document.getElementById("qdMiss").onclick=()=>quizStart(qx.miss.slice());
  document.getElementById("qdAgain").onclick=()=>quizStart();
  document.getElementById("qdBack").onclick=quizBack;
}
function quizBack(){["quizSession","quizDone"].forEach(id=>document.getElementById(id).hidden=true); document.getElementById("quizSetup").hidden=false; refreshSetups();}
document.getElementById("quizStart").onclick=()=>quizStart();
document.getElementById("quizQuit").onclick=quizBack;

function refreshSetups(){ fillRange(flashRange,"flashRange","n20"); fillRange(quizRange,"quizRange","n20"); fillTypes(); flashInfo(); quizInfo(); }
function studyKeys(ev){
  if(ev.target.tagName==="SELECT") return;
  if(S.view==="flash" && !document.getElementById("flashSession").hidden){
    if(ev.key===" "||ev.key==="Enter"){ev.preventDefault(); flashFlip();}
    if(ev.key==="ArrowLeft") flashAnswer(false);
    if(ev.key==="ArrowRight") flashAnswer(true);
  }
  if(S.view==="quiz" && !document.getElementById("quizSession").hidden){
    if(!qx.answered && ["1","2","3","4"].includes(ev.key)){ const b=document.querySelectorAll("#choices button")[+ev.key-1]; if(b) b.click(); }
    else if(qx.answered && ev.key==="Enter" && ev.target.id!=="qNext"){ ev.preventDefault(); quizNext(); }
  }
}

build(); refreshSetups(); showView(VIEWS.includes(S.view)?S.view:"table");
</script>
